name: seg

topology:
  nodes:
    br-lan:
      kind: bridge

    gateway:
      kind: linux
      image: ebpf-host:latest
      # --- LIMITES DE RECURSOS (Simulando Raspberry Pi 4) ---
      cpu: 4.0          # Limita o uso a 4 núcleos de CPU
      memory: "4g"      # Limita a memória RAM a 4 Gigabytes 
      binds:
        - ./scripts:/scripts
        - /sys/fs/bpf:/sys/fs/bpf
        - /lib/modules:/lib/modules
        - /usr/sbin/bpftool:/usr/sbin/bpftool
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.0.1.1/24 dev eth2
        - ip addr add 10.0.2.1/24 dev eth1

    mqtt:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts

    sensor:
      kind: linux
      image: nicolaka/netshoot
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1

    atacante:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts

  links:
    - endpoints: ["sensor:eth1", "br-lan:eth1"]
    - endpoints: ["atacante:eth1", "br-lan:eth2"]
    - endpoints: ["gateway:eth2", "br-lan:eth3"]
    - endpoints: ["gateway:eth1", "mqtt:eth1"]
