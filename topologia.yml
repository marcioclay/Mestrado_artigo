name: seg

topology:
  nodes:
    gateway:
      kind: linux
      image: ebpf-host:latest
             # --- LIMITES DE RECURSOS (Simulando Raspberry Pi 4) ---
      cpu: 4.0          # Limita o uso a 4 núcleos de CPU
      memory: "4g"      # Limita a memória RAM a 4 Gigabytes 
      binds:
        - ./scripts:/scripts
        - /sys/fs/bpf:/sys/fs/bpf
        - /lib/modules:/lib/modules
        - /usr/sbin/bpftool:/usr/sbin/bpftool
      exec:
        # Ativa o encaminhamento de pacotes no Gateway (IP Forwarding)
        - sysctl -w net.ipv4.ip_forward=1
        # Configuração das interfaces no Gateway
        - ip addr add 10.0.1.1/24 dev eth2
        - ip addr add 10.0.2.1/24 dev eth1

    mqtt:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        # Rota default apontando para o Gateway
        - ip route replace default via 10.0.2.1

    sensor:
      kind: linux
      image: nicolaka/netshoot
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        # Rota default apontando para o Gateway
        - ip route replace default via 10.0.1.1

    atacante:
      kind: linux
      image: ubuntu:latest
      binds:
        - ./scripts:/scripts
      exec:
        - ip addr add 10.0.1.20/24 dev eth1
        # Rota default apontando para o Gateway
        - ip route replace default via 10.0.1.1

  links:
    - endpoints: ["gateway:eth1", "mqtt:eth1"]
    - endpoints: ["gateway:eth2", "sensor:eth1"]
    - endpoints: ["gateway:eth3", "atacante:eth1"]
