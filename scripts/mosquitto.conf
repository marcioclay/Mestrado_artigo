# Ouvir em todas as interfaces na porta padrão
listener 1883 0.0.0.0

# Permitir conexões sem autenticação (para o protótipo)
allow_anonymous true

# Limite máximo de conexões simultâneas (padrão 1024, ajustável para testes)
max_connections 1024

# Desativa limites de log pesados para não impactar o desempenho
log_type error
log_type warning
