# Ouvir em todas as interfaces IPv4 na porta padrão
listener 1883 0.0.0.0

# Permitir conexões anônimas
allow_anonymous true

# Limite máximo de conexões simultâneas da aplicação (L7)
max_connections 1024

# Redireciona os logs para o volume compartilhado /scripts
log_dest file /scripts/mosquitto.log

# Tipos de logs válidos para Mosquitto v2.x
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe